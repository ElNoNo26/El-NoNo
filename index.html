<script>
let db={};try{db=JSON.parse(document.getElementById('site-data').textContent);}catch(e){}const config=db.config||{},products=db.products||[],categories=db.categories||[];document.getElementById('header-branding').innerHTML=config.logo?("<img src='"+config.logo+"'>"):config.name;document.getElementById('hero-title').innerText=config.heroTitle;document.getElementById('hero-subtitle').innerText=config.heroSubtitle;document.getElementById('hero-img').src=config.heroImage;document.getElementById('about-text').innerText=config.aboutText;document.title=config.name;let currentCat='Todos',searchTerm='',pendingContact=null;const filtersDiv=document.getElementById('filters-container');filtersDiv.innerHTML="<button class='filter-btn active' onclick=\"filter('Todos', this)\">Todos</button>"+categories.map(c=>"<button class='filter-btn' onclick=\"filter('"+c+"', this)\">"+c+"</button>").join('');const fmtPrice=(p)=>new Intl.NumberFormat('es-AR',{style:'decimal',minimumFractionDigits:0}).format(p);function filter(cat,btn){currentCat=cat;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderGrid()}function handleSearch(val){searchTerm=val.toLowerCase();renderGrid()}function renderGrid(){const grid=document.getElementById('products-grid');grid.innerHTML='';const filtered=products.filter(p=>{const match=(currentCat==='Todos'||p.category===currentCat)&&(p.name.toLowerCase().includes(searchTerm)||p.category.toLowerCase().includes(searchTerm)||(p.desc&&p.desc.toLowerCase().includes(searchTerm)));return match});if(filtered.length===0)grid.innerHTML='<p style=\"grid-column:1/-1;text-align:center;color:#999\">Sin resultados</p>';filtered.forEach(p=>{const c=document.createElement('article');c.className='product-card'+(p.noStock?' out-of-stock':'');c.onclick=()=>openModal(p.id);let priceHtml=p.price?"<div class='card-price'>$"+fmtPrice(p.price)+"</div>":'';let stockBadge=p.noStock?"<div class='stock-badge'>SIN STOCK</div>":"";c.innerHTML=stockBadge+"<div class='card-img-container'><img src='"+p.img+"' loading='lazy' onerror=\"this.src='https://via.placeholder.com/300'\"></div><div class='card-body'><span class='card-cat'>"+p.category+"</span><h3 class='card-title'>"+p.name+"</h3>"+priceHtml+"</div>";grid.appendChild(c)})}const feat=products.filter(p=>p.featured);const carCont=document.getElementById('featured-container');if(feat.length){carCont.innerHTML=feat.map(p=>"<div class='featured-card' onclick='openModal("+p.id+")'><img src='"+p.img+"' class='featured-img'><div class='featured-overlay'><div class='featured-title'>"+p.name+"</div><div class='featured-detail'>( Ver detalles )</div></div></div>").join('');let autoScrollInterval;function startAutoScroll(){clearInterval(autoScrollInterval);autoScrollInterval=setInterval(()=>{const maxScroll=carCont.scrollWidth-carCont.clientWidth;if(carCont.scrollLeft>=maxScroll-5){carCont.scrollTo({left:0,behavior:'smooth'})}else{carCont.scrollBy({left:280,behavior:'smooth'})}},3000)}startAutoScroll();carCont.addEventListener('touchstart',()=>clearInterval(autoScrollInterval));carCont.addEventListener('touchend',()=>startAutoScroll())}function openModal(id){const p=products.find(x=>x.id===id);if(!p)return;document.body.classList.add('modal-open');document.getElementById('m-img').src=p.img;document.getElementById('m-cat').innerText=p.category;document.getElementById('m-title').innerText=p.name;document.getElementById('m-dims').innerText=p.dims;document.getElementById('m-desc').innerHTML=p.desc;const priceEl=document.getElementById('m-price');if(p.price){priceEl.innerText="$"+fmtPrice(p.price);priceEl.style.display='block'}else priceEl.style.display='none';const thumbsDiv=document.getElementById('m-thumbs');thumbsDiv.innerHTML='';const allImgs=[p.img].concat(p.gallery||[]);if(allImgs.length>1){thumbsDiv.style.display='flex';allImgs.forEach((src,i)=>{const img=document.createElement('img');img.src=src;img.className=i===0?'thumb-item active':'thumb-item';img.onclick=()=>{document.getElementById('m-img').src=src;document.querySelectorAll('.thumb-item').forEach(x=>x.classList.remove('active'));img.classList.add('active')};thumbsDiv.appendChild(img)})}else thumbsDiv.style.display='none';document.getElementById('m-img').onclick=()=>{document.getElementById('lightbox-img').src=document.getElementById('m-img').src;document.getElementById('lightbox').style.display='flex'};const waBtn=document.getElementById('m-wa');if(p.noStock){waBtn.style.background='#6b7280';document.getElementById('wa-text').innerText='Consultar Reposición'}else{waBtn.style.background='#25D366';document.getElementById('wa-text').innerText='Consultar en WhatsApp'}waBtn.onclick=()=>openNameModal(p);document.getElementById('product-modal').classList.add('open')}function closeModal(){document.getElementById('product-modal').classList.remove('open');document.body.classList.remove('modal-open')}document.getElementById('main-wa-btn').onclick=()=>openNameModal(null);function openNameModal(p){pendingContact=p;document.getElementById('name-modal').classList.add('open');setTimeout(()=>document.getElementById('user-name-input').focus(),100)}function getArticle(name){const lower=name.toLowerCase().trim();if(lower.endsWith('a')&&!lower.endsWith('sofá'))return 'la';return 'el'}function confirmName(){const n=document.getElementById('user-name-input').value.trim();if(!n)return alert("Por favor escribe tu nombre");let t="";if(pendingContact){const art=getArticle(pendingContact.name);const action=pendingContact.noStock?"consultar cuándo vuelve a entrar":"consultar por";t="Hola! Me llamo "+n+". Quería "+action+" "+art+" \""+pendingContact.name+"\" que vi en su página."}else{t="Hola! Me llamo "+n+". Les escribo para ponerme en contacto con ustedes y consultarles sobre los muebles que vi en su página."}window.open("https://wa.me/"+config.whatsapp+"?text="+encodeURIComponent(t),'_blank');document.getElementById('name-modal').classList.remove('open')}function shareProduct(){if(navigator.share){navigator.share({title:document.getElementById('m-title').innerText,text:'Mirá este mueble de '+config.name,url:window.location.href}).catch(console.error)}else{alert("Copiá este link: "+window.location.href)}}document.getElementById('user-name-input').onkeypress=(e)=>{if(e.key==='Enter')confirmName()};renderGrid();
</script>
